#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx5120M
#Gradle
org.gradle.jvmargs=-Xmx5120M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
app.compileSdk=37
app.targetSdk=37
app.minSdk=26
android.useAndroidX=true
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
# Disable incremental JS/Wasm compilation to fix WasmGC KT-84337 type mismatch
kotlin.incremental.js=false
kotlin.incremental.js.klib=false
kotlin.incremental.wasm=false
kotlin.incremental.wasm.js=false
kotlin.incremental.wasm.klib=false
kotlin.wasm.incremental=false
