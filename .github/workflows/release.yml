name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_ACTOR: ${{ github.actor }}

jobs:
  build-server-android-linux:
    name: Build Server, Plugins, Android & Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Core Contract
        uses: actions/checkout@v4
        with:
          repository: 'ensodai/avalon-media-card-core-contract'
          path: '../avalon-media-card-core-contract'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build All Targets (Parallel)
        run: |
          ./gradlew compileAll \
            :server:buildFatJar \
            :web:wasmJsBrowserDistribution \
            :androidApp:assembleDebug \
            :desktopApp:packageDeb \
            --parallel

      - name: Collect artifacts
        run: |
          mkdir -p dist
          
          # 1. Сервер
          if [ -f server/build/libs/avalon-media-card-server.jar ]; then
            cp server/build/libs/avalon-media-card-server.jar dist/avalon-server.jar
          fi
          
          # 2. Плагины в один архив
          if [ -d server/plugins ] && [ "$(ls -A server/plugins)" ]; then
            zip -j dist/avalon-plugins.zip server/plugins/*.jar
          fi
          
          # 3. Android APK
          if [ -f androidApp/build/outputs/apk/debug/androidApp-debug.apk ]; then
            cp androidApp/build/outputs/apk/debug/androidApp-debug.apk dist/avalon-android.apk
          fi
          
          # 4. Linux DEB
          find desktopApp/build/compose/binaries/main/deb -name "*.deb" -exec cp {} dist/avalon-linux.deb \;

          # 5. Веб-клиент (Wasm)
          DIST_ROOT="$(pwd)/dist"
          if [ -d web/build/dist/wasmJs/productionExecutable ]; then
            (cd web/build/dist/wasmJs/productionExecutable && zip -r "$DIST_ROOT/avalon-web.zip" .)
          elif [ -d web/build/dist/wasmJs ]; then
            (cd web/build/dist/wasmJs && zip -r "$DIST_ROOT/avalon-web.zip" .)
          fi

      - name: Upload Linux & Server Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux-server
          path: dist/*
          retention-days: 1

  build-windows:
    name: Build Windows Desktop (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Core Contract
        uses: actions/checkout@v4
        with:
          repository: 'ensodai/avalon-media-card-core-contract'
          path: '../avalon-media-card-core-contract'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Download MPV Player DLLs
        shell: bash
        run: bash scripts/download_mpv.sh

      - name: Build Windows Installer (.exe & .msi)
        shell: bash
        run: ./gradlew :desktopApp:packageExe :desktopApp:packageMsi --parallel

      - name: Collect Windows Artifacts
        shell: bash
        run: |
          mkdir -p dist-win
          find desktopApp/build/compose/binaries/main/exe -name "*.exe" -exec cp {} dist-win/avalon-windows.exe \; || true
          find desktopApp/build/compose/binaries/main/msi -name "*.msi" -exec cp {} dist-win/avalon-windows.msi \; || true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: dist-win/*
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-server-android-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Release ${{ steps.release_info.outputs.tag }}"
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
