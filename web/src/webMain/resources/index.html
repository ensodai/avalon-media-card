<!DOCTYPE html>
<html lang="en" style="background: #000000;">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="avalon-build-hash" content="dev-local">
    <title>Avalon Media Card</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="styles.css" rel="stylesheet" type="text/css">
    <script>
        // Ультимативный Cache-Busting для Compose Multiplatform ресурсов (.cvr, шрифты, картинки)
        (function() {
            function getBuildHash() {
                var meta = document.querySelector('meta[name="avalon-build-hash"]');
                return meta ? meta.getAttribute('content') : '';
            }
            function appendHash(url) {
                if (typeof url === 'string' && url.indexOf('composeResources/') !== -1 && url.indexOf('v=') === -1) {
                    var h = getBuildHash();
                    if (h) {
                        return url + (url.indexOf('?') !== -1 ? '&' : '?') + 'v=' + encodeURIComponent(h);
                    }
                }
                return url;
            }
            var origFetch = window.fetch;
            if (origFetch) {
                window.fetch = function(resource, init) {
                    if (typeof resource === 'string') {
                        resource = appendHash(resource);
                    } else if (resource && typeof resource.url === 'string') {
                        var patched = appendHash(resource.url);
                        if (patched !== resource.url) {
                            try { resource = new Request(patched, resource); } catch (e) {}
                        }
                    }
                    return origFetch.call(this, resource, init);
                };
            }
            var origOpen = XMLHttpRequest.prototype.open;
            if (origOpen) {
                XMLHttpRequest.prototype.open = function(method, url) {
                    if (typeof url === 'string') {
                        url = appendHash(url);
                    }
                    return origOpen.apply(this, [method, url].concat(Array.prototype.slice.call(arguments, 2)));
                };
            }
        })();
    </script>
    <!-- Подключение локальной версии hls.js -->
    <script defer src="hls.js"></script>
    <!-- Подключение локальной версии dash.js (MPEG-DASH) -->
    <script defer src="dash.all.min.js"></script>
</head>
<body style="background: #000000; text-align: center; align-content: center">
<!-- Мгновенный HTML лоадер до запуска Compose -->
<div id="avalon-html-loader" class="loader-container">
    <div class="cinematic-loader">
        <div class="loader-orb"></div>
        <svg class="loader-spinner" viewBox="0 0 60 60">
            <defs>
                <linearGradient id="spinner-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
                    <stop offset="60%" stop-color="#ffffff" stop-opacity="0.3" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                </linearGradient>
            </defs>
            <circle class="loader-track" cx="30" cy="30" r="26" />
            <circle class="loader-arc" cx="30" cy="30" r="26" />
        </svg>
    </div>
</div>

<div id="video-underlay-container"></div>
<div id="compose-root"></div>
<script src="web.js" type="application/javascript"></script>
</body>
</html>
